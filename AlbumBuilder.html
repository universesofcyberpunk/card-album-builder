<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Kotamon Album Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: the game's album book — tab strip on top, a 2×5 page of slots on the left, the open card large on the right. */
:root {
  --paper: #eef3fb;
  --book: #5b8fd6;
  --book-deep: #2f5ea6;
  --page: #ffffff;
  --ink: #1e2246;
  --ink-soft: #5a6087;
  --line: #c8d3ea;
  --accent: #e2397a;
  --accent-ink: #ffffff;
  --slot: #dfe9f8;
  --f-display: "Baloo 2", "Segoe UI", system-ui, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121530; --book: #2b4f8f; --book-deep: #1b3566; --page: #1c2142; --ink: #e8ebf8; --ink-soft: #a5acd0;
    --line: #333a68; --accent: #ff5c9a; --accent-ink: #1a0b12; --slot: #262c56; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121530; --book: #2b4f8f; --book-deep: #1b3566; --page: #1c2142; --ink: #e8ebf8; --ink-soft: #a5acd0;
  --line: #333a68; --accent: #ff5c9a; --accent-ink: #1a0b12; --slot: #262c56; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { padding-inline: 16px; padding-block: 16px 36px; max-width: none; margin: 0; display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; letter-spacing: 0.01em; margin: 0; line-height: 1.05; }
h1 { font-size: 2.2rem; }
h2 { font-size: 1.4rem; }
.top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; justify-content: space-between; }
.top p { margin: 4px 0 0; color: var(--ink-soft); max-width: 70ch; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: 700 0.92rem var(--f-body); padding: 8px 14px; border-radius: 9px; border: 2px solid var(--ink); background: var(--page); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 5px 10px; font-size: 0.82rem; border-width: 1px; }
.btn.ghost { border-color: var(--line); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
label.f, div.f { display: grid; gap: 3px; min-width: 0; }
label.f > span, div.f > span { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-soft); }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; font: 500 0.95rem var(--f-body); color: var(--ink); background: var(--page);
  border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px;
}
textarea { resize: vertical; min-height: 64px; }
input[type="color"] { width: 44px; height: 36px; border: 1px solid var(--line); border-radius: 7px; background: var(--page); padding: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.grid2 > * { min-width: 0; }
input[type=file] { max-width: 100%; min-width: 0; }
.album-bar { background: var(--page); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
/* tabs like the game's book tabs */
.tabstrip { display: flex; gap: 6px; align-items: end; flex-wrap: wrap; padding-inline: 14px; margin-bottom: -14px; position: relative; z-index: 1; }
.tabstrip .tab { margin-bottom: -3px; }
.tab { --c: #5a8ae0; width: 64px; height: 58px; border-radius: 12px 12px 0 0; border: 3px solid var(--ink); border-bottom: none; background: var(--c);
  display: grid; place-items: center; cursor: pointer; position: relative; padding: 0; }
.tab img { width: 40px; height: 40px; object-fit: contain; }
.tab[aria-selected="true"] { height: 70px; box-shadow: inset 0 -6px 0 rgba(255,255,255,0.35); }
.tab .n { position: absolute; top: -9px; right: -9px; background: var(--ink); color: var(--page); font: 700 0.7rem var(--f-body); border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; }
.tab.add { --c: transparent; border-style: dashed; color: var(--ink); font: 800 1.8rem var(--f-display); }
.desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .desk { grid-template-columns: 1fr; } }
.book { background: var(--book); border: 3px solid var(--ink); border-radius: 16px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.tabset { background: var(--page); border-radius: 10px; padding: 10px 12px; display: grid; gap: 10px; }
.tabset-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.tabset-row .f:first-child { flex: 1 1 180px; }
.tabset-row input[type=color] { width: 64px; height: 38px; padding: 2px; }
.icons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ic { width: 42px; height: 42px; border-radius: 9px; border: 2px solid var(--line); background: var(--slot); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ic img { width: 30px; height: 30px; object-fit: contain; }
.ic[aria-pressed="true"] { border-color: var(--accent); }
.page { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .page { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.slot { aspect-ratio: 625 / 1024; border-radius: 10px; background: var(--slot); border: 2px dashed rgba(255,255,255,0.7); display: grid; place-items: center;
  cursor: pointer; padding: 0; overflow: hidden; color: var(--book-deep); font: 800 1.6rem var(--f-display); position: relative; }
.slot canvas { width: 100%; height: 100%; display: block; }
.slot.filled { border: 2px solid transparent; background: transparent; }
.slot[aria-pressed="true"] { border: 3px solid var(--accent); }
.fmt { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.fmt button { min-width: 30px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--page); color: var(--ink); font: 700 0.9rem var(--f-body); cursor: pointer; padding: 0 6px; }
.fmt button.sw { min-width: 26px; width: 26px; background: var(--sw); }
.f .hint { font-size: 0.74rem; color: var(--ink-soft); line-height: 1.35; text-transform: none; letter-spacing: 0; font-weight: 500; }
.f .hint code { font-size: 0.72rem; }
.modebar { display: grid; gap: 8px; }
.modebar .seg { display: flex; gap: 6px; flex-wrap: wrap; }
.modebar .seg .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.modebar .note { margin: 0; }
.slot .gid { position: absolute; right: 4px; top: 3px; font: 700 0.62rem var(--f-body); background: rgba(0,0,0,.6); color: #fff; padding: 1px 5px; border-radius: 999px; }
.backrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.backrow img { width: 40px; height: 64px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); }
.slot .raw { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); white-space: nowrap; font: 700 0.62rem var(--f-body); background: #e8407a; color: #fff; padding: 2px 6px; border-radius: 999px; }
.slot .no { position: absolute; left: 4px; top: 3px; font: 700 0.7rem var(--f-body); color: var(--ink-soft); }
.editor { background: var(--page); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.ed-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 560px) { .ed-grid { grid-template-columns: 1fr; } }
.preview { display: grid; gap: 6px; justify-items: center; align-content: start; }
#view { width: 100%; max-width: calc(88vh * 625 / 1024); aspect-ratio: 625 / 1024; height: auto; border-radius: 12px; }
.pv-tabs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.pv-tabs button { line-height: 1.3; height: auto; align-self: center; white-space: nowrap; font: 600 0.75rem var(--f-body); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.pv-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.fields { display: grid; gap: 9px; min-width: 0; align-content: start; }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; background: var(--slot); padding: 8px 10px; border-radius: 8px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.check small { display: block; font-weight: 500; color: var(--ink-soft); }
details summary { cursor: pointer; font-weight: 600; color: var(--ink-soft); }
.empty { color: var(--ink-soft); text-align: center; padding: 30px 10px; }
.note { font-size: 0.85rem; color: var(--ink-soft); margin: 0; }
.status { font-size: 0.88rem; min-height: 1.3em; margin: 0; color: var(--book-deep); font-weight: 600; }
.out { display: grid; gap: 10px; }
.out textarea { font-family: ui-monospace, "Cascadia Mono", monospace; font-size: 0.78rem; min-height: 120px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.lang { display: inline-flex; gap: 4px; }
.lang .btn { min-width: 44px; }
/* guided tour */
.tour-shade { display: none; }
.tour-spot { position: fixed; z-index: 51; border-radius: 12px; box-shadow: 0 0 0 4px var(--accent), 0 0 0 9999px rgba(10, 12, 30, 0.45); transition: all .22s ease; pointer-events: none; }
.tour-pop { position: fixed; z-index: 52; width: min(360px, calc(100vw - 32px)); background: var(--page); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 14px 16px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.tour-pop h3 { font-size: 1.15rem; margin-bottom: 6px; }
.tour-pop p { margin: 0 0 10px; font-size: 0.92rem; color: var(--ink-soft); }
.tour-pop ul { margin: 0 0 10px; padding-left: 18px; font-size: 0.88rem; color: var(--ink-soft); }
.tour-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tour-count { font-size: 0.8rem; font-weight: 700; color: var(--ink-soft); }
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1 id="t-title">Kotamon Album Builder</h1>
      <p id="t-sub"></p>
    </div>
    <div class="btns">
      <div class="lang" role="group" aria-label="Language"><button type="button" class="btn small" id="langTR" lang="tr">TR</button><button type="button" class="btn small" id="langEN" lang="en">EN</button></div>
      <button type="button" class="btn ghost" id="tourBtn">Guide</button>
      <label class="btn ghost" for="importDir" id="t-import">Open album folder</label>
      <input id="importDir" type="file" webkitdirectory multiple hidden>
      <button class="btn primary" id="download" type="button">Download album (.zip)</button>
    </div>
  </div>
  <p class="status" id="status" role="status"></p>

  <section class="album-bar modebar" id="modeBar">
    <div class="seg" role="group"><button type="button" class="btn small" id="modeAlbum"></button><button type="button" class="btn small" id="modeReplace"></button></div>
    <p class="note" id="modeHint"></p>
    <div class="btns" id="gameBar" hidden>
      <label class="btn small" for="gameDir" id="gameOpen"></label><input id="gameDir" type="file" webkitdirectory multiple hidden>
      <button type="button" class="btn small" id="gameAll"></button>
      <span class="note" id="gameInfo"></span>
    </div>
  </section>

  <section class="album-bar">
    <div class="grid2">
      <label class="f"><span id="t-aname">Album name</span><input id="aName" type="text" value="Night City"></label>
      <label class="f"><span id="t-artist">Artist</span><input id="aArtist" type="text" value="Fabianens"></label>
      <label class="f"><span id="t-back">Card back (image)</span><input id="aBack" type="file" accept="image/*"></label>
      <label class="f"><span id="t-cover">Album cover (image)</span><input id="aCover" type="file" accept="image/*"></label>
    </div>
  </section>

  <details class="album-bar" id="styleBox" open>
    <summary id="t-style">Card style</summary>
    <div class="grid2 style-grid" id="styleFields" style="margin-top:10px"></div>
  </details>

  <div class="tabstrip" id="tabs" role="tablist"></div>
  <div class="desk">
    <section class="book">
      <div class="tabset" id="tabset"></div>
      <div class="page" id="page"></div>
      <p class="note" style="color:#fff" id="t-pagenote"></p>
    </section>

    <section class="editor" id="editor"></section>
  </div>

  <details class="album-bar">
    <summary id="t-files">album.json and cards.csv (for manual copying)</summary>
    <div class="out">
      <textarea id="jsonOut" readonly></textarea>
      <textarea id="csvOut" readonly></textarea>
      <div class="btns"><button class="btn small" id="copyJson" type="button">Copy album.json</button><button class="btn small" id="copyCsv" type="button">Copy cards.csv</button></div>
    </div>
  </details>
</div>

  text = text.replace(/^﻿/, ""); const first = text.split("\n")[0], sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === sep) { row.push(f); f = ""; } else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f); f = ""; if (row.some(x => x !== "")) rows.push(row); row = []; } else f += ch; }
  if (f || row.length) { row.push(f); rows.push(row); }
  const h = (rows.shift() || []).map(x => x.trim().toLowerCase()); return rows.map(r => Object.fromEntries(h.map((k, i) => [k, (r[i] || "").trim()])));
}
async function importDir(fl) {
  const byName = {}; for (const f of fl) byName[f.name.toLowerCase()] = f;
  const isR = !!byName["replace.json"] && !byName["album.json"]; st.mode = isR ? "replace" : "album";
  const ajf = byName[isR ? "replace.json" : "album.json"];
  let aj = {}; try { if (ajf) aj = JSON.parse((await ajf.text()).replace(/^\s*\/\/.*$/gm, "").replace(/\/\/[^"\n]*$/gm, "")); } catch (e) {}
  const rows = byName["cards.csv"] ? parseCsv(await byName["cards.csv"].text()) : [];
  $("aName").value = aj.name || (fl[0]?.webkitRelativePath || "").split("/")[0] || "Album"; $("aArtist").value = aj.artist || "";
  st.back = byName[(aj.card_back || "").toLowerCase()] || byName["card_back.png"] || byName["card_back.jpg"] || null;
  st.cover = byName[(aj.cover || "").toLowerCase()] || byName["cover.png"] || byName["cover.jpg"] || null;
  const tabs = Array.isArray(aj.tabs) && aj.tabs.length ? aj.tabs : [];
  st.style = defStyle(); const cs = aj.card_style || {};
  for (const k of ["frame", "band", "band_color", "tag_color"]) if (typeof cs[k] === "string") st.style[k] = cs[k].toLowerCase();
  if (cs.badges) RN.forEach((r, i) => { if (typeof cs.badges[r] === "string") st.style.badges[i] = cs.badges[r].toLowerCase(); });
  if (cs.tag_align) st.style.tag_align = String(cs.tag_align).toLowerCase();
  if (cs.stats_bg !== undefined) st.style.stats_bg = !(cs.stats_bg === false || ["no", "false", "0", "off"].includes(String(cs.stats_bg).toLowerCase()));
  if (cs.frames) RN.forEach((r, i) => { const v = cs.frames[r]; if (v !== undefined) st.style.frames[i] = !(v === false || ["no", "false", "0", "off"].includes(String(v).toLowerCase())); });
  renderStyle();
  st.tabs = tabs.map((t, i) => { const nt = newTab(i); nt.name = t.name || nt.name; nt.color = t.color || aj.color || nt.color;
    if (ICONS.includes(t.icon)) nt.icon = t.icon; else if (t.icon && byName[t.icon.toLowerCase()]) { const f = byName[t.icon.toLowerCase()]; nt.iconFile = { file: f, url: URL.createObjectURL(f) }; } return nt; });
  const known = new Set(rows.map(r => (r.file || "").toLowerCase()));
  const extra = fl.filter(f => /\.(png|jpe?g)$/i.test(f.name) && !known.has(f.name.toLowerCase()) && !/^(cover|card_back|box|kapak|sirt)\./i.test(f.name) && !/^tab_\d+_icon\./i.test(f.name) && !/^back_/i.test(f.name) && !f.name.startsWith("_"));
  const all = isR ? rows.filter(r => r.game_id !== undefined && r.game_id !== "") : [...rows.filter(r => byName[(r.file || "").toLowerCase()]), ...extra.map(f => ({ file: f.name }))];
  st.cards = []; const fill = {};
  for (const r of all) {
    let tab = Math.max(0, (+r.tab || 0) - 1); if (!r.tab) { tab = 0; while ((fill[tab] || 0) >= 10) tab++; }
    if ((fill[tab] || 0) >= 10) { tab = 0; while ((fill[tab] || 0) >= 10) tab++; }
    fill[tab] = (fill[tab] || 0) + 1; while (st.tabs.length <= tab) { const nt = newTab(st.tabs.length); if (aj.color) nt.color = aj.color; if (!tabs.length) { nt.name = `${$("aName").value} ${st.tabs.length + 1}`; nt.icon = "mod"; } st.tabs.push(nt); }
    const c = { id: uid++, tab, name: r.name || "", name_tr: r.name_tr || "", desc: (r.description || "").replace(/\\n/g, "\n"), desc_tr: (r.description_tr || "").replace(/\\n/g, "\n"),
      tags: r.tags || "", tags_tr: r.tags_tr || "", hp: +r.hp || 0, atk: +r.atk || 0, rarity: Math.max(0, RAR.findIndex(x => x.toLowerCase() === (r.rarity || "").toLowerCase()), RN.indexOf((r.rarity || "").toUpperCase())),
      show: !/^(no|0|false|hay[ıi]r)$/i.test(r.show_info || ""),
      frame: /^(no|0|false|off|hay[ıi]r)$/i.test(r.frame || "") ? "no" : /^(yes|1|true|on|evet)$/i.test(r.frame || "") ? "yes" : "",
      title_bg: yn(r.title_bg), stats_bg: yn(r.stats_bg), tags_align: ["left", "center", "right"].includes((r.tags_align || "").trim().toLowerCase()) ? r.tags_align.trim().toLowerCase() : "" };
    if (!isR) c.cid = +r.id || (r.file ? kid(((fl[0]?.webkitRelativePath || "").split("/")[0] || safe($("aName").value || "MyAlbum")) + "/" + r.file) : 0);
    if (isR) { c.game_id = +r.game_id; if (!r.hp) c.hp = 60; if (!r.atk) c.atk = 30; }
    if (!c.name && !c.name_tr) c.name = c.name_tr = (r.file || "").replace(/\.[^.]+$/, "").replace(/_/g, " ");
    st.cards.push(c); const imf = byName[(r.file || "").toLowerCase()]; if (imf) { await setImage(c, imf); c.fname = r.file; }
    const bf = byName[(r.card_back || "").toLowerCase()]; if (bf) { c.backFile = bf; c.backUrl = URL.createObjectURL(bf); }
    if (isR) await gamePx(c);
  }
  if (!st.tabs.length) st.tabs.push(newTab(0));
  st.tab = 0; st.card = null; renderMode(); renderAll(); say(T.imported(st.cards.length));
}

function copy(id) { const ta = $(id); navigator.clipboard.writeText(ta.value).then(() => say(T.copied), () => { ta.focus(); ta.select(); say(T.selected); }); }


// ---------- guided tour (reopen with the Guide button; opens by itself the first time) ----------
let tourI = -1, tourEls = null;
function tourOpen(i = 0) {
  tourClose(true);
  const shade = document.createElement("div"); shade.className = "tour-shade";
  const spot = document.createElement("div"); spot.className = "tour-spot";
  const pop = document.createElement("div"); pop.className = "tour-pop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-modal", "true");
  document.body.append(shade, spot, pop); tourEls = { shade, spot, pop };
  document.addEventListener("keydown", tourKey); window.addEventListener("resize", tourPlace); window.addEventListener("scroll", tourPlace, true);
  tourEls.timer = setInterval(tourPlace, 300);
  tourGo(i);
}
// remembered step: the guide reopens where it was left; -1 = finished (reopens from the start)
function tourStep(v) { try { if (v === undefined) { const x = localStorage.getItem("kotamon-builder-tour-step"); return x === null ? null : +x; } localStorage.setItem("kotamon-builder-tour-step", String(v)); } catch (e) { return null; } }
function tourResume() { const n = (TR ? TOUR_TR : TOUR_EN).length, x = tourStep(); tourOpen(x !== null && x >= 0 && x < n ? x : 0); }
// The page stays usable while the guide is open; only the Close button closes it. Arrow keys move steps unless typing in a field.
function tourKey(e) { if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return; if (e.key === "ArrowRight") tourGo(tourI + 1); else if (e.key === "ArrowLeft") tourGo(tourI - 1); }
function tourClose(silent) {
  if (!tourEls) return;
  clearInterval(tourEls.timer);
  for (const el of [tourEls.shade, tourEls.spot, tourEls.pop]) el.remove();
  tourEls = null; tourI = -1;
  document.removeEventListener("keydown", tourKey); window.removeEventListener("resize", tourPlace); window.removeEventListener("scroll", tourPlace, true);
  if (!silent) try { localStorage.setItem("kotamon-builder-tour", "done"); } catch (e) {}
}
function tourGo(i) {
  const steps = TR ? TOUR_TR : TOUR_EN;
  if (i < 0) return; if (i >= steps.length) { tourStep(-1); tourClose(); return; }
  tourI = i; tourStep(i); const [sel, title, html] = steps[i], { pop } = tourEls;
  if (sel === "#styleBox") $("styleBox").open = true;
  const [lead, rest] = html.split("<ul>"), body = `<p>${lead}</p>` + (rest ? `<ul>${rest.split("</ul>")[0]}</ul><p>${rest.split("</ul>")[1] || ""}</p>` : "");
  pop.setAttribute("aria-label", title);
  pop.innerHTML = `<h3>${title}</h3><div>${body}</div>
    <div class="tour-foot"><span class="tour-count">${i + 1} / ${steps.length}</span><div class="btns">
    <button type="button" class="btn small ghost" id="tourSkip">${T.tourSkip}</button>
    ${i > 0 ? `<button type="button" class="btn small" id="tourBack">${T.tourBack}</button>` : ""}
    <button type="button" class="btn small primary" id="tourNext">${i === steps.length - 1 ? T.tourDone : T.tourNext}</button></div></div>`;
  $("tourSkip").onclick = () => tourClose(); $("tourNext").onclick = () => tourGo(i + 1); if ($("tourBack")) $("tourBack").onclick = () => tourGo(i - 1);
  const target = document.querySelector(sel);
  if (target) target.scrollIntoView({ block: "center", behavior: "instant" });
  tourPlace();
}
function tourPlace() {
  if (!tourEls) return;
  const steps = TR ? TOUR_TR : TOUR_EN, target = document.querySelector(steps[tourI][0]), { spot, pop } = tourEls, pad = 6, vw = innerWidth, vh = innerHeight;
  const r = target ? target.getBoundingClientRect() : { left: vw / 2, top: vh / 2, width: 0, height: 0, right: vw / 2, bottom: vh / 2 };
  const top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad), bottom = Math.min(vh - 4, r.bottom + pad), right = Math.min(vw - 4, r.right + pad);
  Object.assign(spot.style, { top: top + "px", left: left + "px", width: Math.max(0, right - left) + "px", height: Math.max(0, bottom - top) + "px" });
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let y = bottom + 12; if (y + ph > vh - 8) y = top - ph - 12; if (y < 8) y = Math.max(8, Math.min(vh - ph - 8, (vh - ph) / 2));
  let x = Math.min(Math.max(8, left), vw - pw - 8);
  Object.assign(pop.style, { top: y + "px", left: x + "px" });
}

async function boot() {
  for (const n of ["number", "tag", "title"]) { const i = await img(A["atlas_" + n].img); atlas[n] = { img: i, p: pixels(i), H: A["atlas_" + n].meta.H, h: A["atlas_" + n].meta.harfler }; }
  for (const n of ICONS) badges[n] = pixels(await img(A["badge_" + n]));
  // example album so the page opens in a working state
  st.tabs = [newTab(0), newTab(1)]; st.tabs[0].name = TR ? "Şehir" : "City"; st.tabs[0].icon = "city"; st.tabs[0].color = "#5b2a6e"; st.tabs[1].name = TR ? "Gökyüzü" : "Sky"; st.tabs[1].icon = "sky"; st.tabs[1].color = "#3ab0c0";
  const sample = pixels(await img(A.sample));
  const ex = [
    { name: "Night Shift", name_tr: "Gece Vardiyası", desc: "Rarely seen in the city zone.", desc_tr: "Şehir bölgesinde nadiren görülür.", tags: "city, night", tags_tr: "şehir, gece", hp: 180, atk: 85, rarity: 2, show: true },
    { name: "Poster Card", name_tr: "Afiş Kartı", desc: "", desc_tr: "", tags: "", tags_tr: "", hp: 0, atk: 0, rarity: 1, show: false }
  ];
  for (const e of ex) st.cards.push({ id: uid++, tab: 0, file: null, px: sample, url: null, fname: "", ...e });
  st.card = st.cards[0].id;
  $("langTR").onclick = () => setLang(true); $("langEN").onclick = () => setLang(false);
  $("importDir").onchange = e => importDir([...e.target.files]);
  $("download").onclick = download;
  $("modeAlbum").onclick = () => setMode("album"); $("modeReplace").onclick = () => setMode("replace");
  $("gameDir").onchange = e => loadGame([...e.target.files]); $("gameAll").onclick = addAllGame;
  $("copyJson").onclick = () => copy("jsonOut"); $("copyCsv").onclick = () => copy("csvOut");
  $("aBack").onchange = e => { st.back = e.target.files[0] || null; out(); };
  $("aCover").onchange = e => { st.cover = e.target.files[0] || null; out(); };
  $("aName").oninput = out; $("aArtist").oninput = out;
  $("tourBtn").onclick = tourResume;
  renderStyle(); renderAll();
  let seen = null; try { seen = localStorage.getItem("kotamon-builder-tour"); } catch (e) {}
  if (!seen) setTimeout(tourResume, 400);
  say(TR ? "Örnek albüm açık: kendi görsellerini seçerek kartları değiştir ya da Albüm klasörünü aç." : "An example album is open: replace the images with yours, or open an album folder.");
}
